<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The browser tab reuses the Tauri icon set instead of a second copy of the brand mark. -->
    <link rel="icon" type="image/png" href="/src-tauri/icons/64x64.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PuffSQL</title>
    <script>
      // Apply the persisted colour mode before first paint so a dark-mode user never sees a light
      // flash while the Vue app boots and calls themeManager.initTheme(). Light is the default:
      // the minimal design is light-first.
      (function () {
        var mode = 'light';
        try {
          var raw = localStorage.getItem('sqlight_app_settings');
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed && parsed.colorMode === 'dark') mode = 'dark';
          }
        } catch (e) {
          /* ignore unreadable settings and keep the light default */
        }
        var root = document.documentElement;
        root.classList.toggle('dark', mode === 'dark');
        root.style.colorScheme = mode;
      })();

      // Early guard to suppress system/browser context menu
      window.addEventListener('contextmenu', (e) => e.preventDefault());
    </script>
  </head>
  <body class="bg-dark-900 text-dark-100 select-none overflow-hidden antialiased">
    <div id="app" class="w-screen h-screen flex flex-col overflow-hidden"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
